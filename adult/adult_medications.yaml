# =============================================================================
# Adult Medication Table
# =============================================================================
#
# Keyed by the drug-name portion of the med strings in adult_conditions.yaml
# ("lisinopril 10mg" -> "lisinopril"; "fluticasone nasal spray" -> its own key).
#
# Fields
#   rxnorm:     RxCUI. Ingredient (IN), precise ingredient (PIN) or
#               multiple-ingredient (MIN) concept. Every code was resolved and
#               its name/term type confirmed against RxNav
#               (https://rxnav.nlm.nih.gov/REST/rxcui/<id>/properties.json)
#               on 2026-10-27. Do not add a drug without doing the same.
#   rxnorm_name: RxNorm concept name, for audit.
#   display:    Base display name in the chart.
#   classes:    Therapeutic classes for duplicate-therapy checks. Two active
#               drugs sharing a class are never prescribed together.
#   route / frequency / prn / instructions: from the FDA label (DailyMed) for
#               the usual adult maintenance regimen unless a source says
#               otherwise.
#   unit:       Unit to use when the condition string has none
#               ("budesonide/formoterol 160/4.5" -> mcg).
#   dose:       Dose to use when the condition string has none
#               ("fluticasone nasal spray"). [quantity, unit].
#   course_days: Finite course; the med is recorded as completed afterwards.
#   by_strength: Overrides keyed by the strength token in the condition
#               string (e.g. naltrexone 380mg is the monthly IM depot).
#   by_condition: Overrides keyed by condition (pramipexole for RLS is dosed
#               once at night, for Parkinson's three times daily).
#   female_only_for: Conditions where this drug is used only in females
#               (spironolactone for acne is an anti-androgen).
#
# Drugs with no verifiable RxNorm code are deliberately absent and are skipped
# by the engine: "areds2 vitamins" (a multi-ingredient supplement with no
# single RxNorm concept) and "phototherapy" (a procedure, not a drug).
# =============================================================================

