# Screening schedule (for well visits)
screening_schedule:
  newborn:
    - name: "Newborn metabolic screen"
      required: true
    - name: "Critical congenital heart disease screen"
      required: true
    - name: "Hearing screen"
      required: true
    - name: "Bilirubin"
      required: true
      
  1_month:
    - name: "Maternal depression screen"
      tool: "Edinburgh Postnatal Depression Scale"
      
  2_months:
    - name: "Developmental surveillance"
      
  4_months:
    - name: "Developmental surveillance"
      
  6_months:
    - name: "Developmental surveillance"
      
  9_months:
    - name: "Developmental screen"
      tool: "ASQ-3"
    - name: "Maternal depression screen"
      
  12_months:
    - name: "Lead screen"
      notes: "If risk factors present"
    - name: "Hemoglobin/Hematocrit"
    - name: "Developmental surveillance"
    - name: "Autism screen"
      tool: "M-CHAT-R/F"
      start_age_months: 16
      end_age_months: 30
      
  18_months:
    - name: "Developmental screen"
      tool: "ASQ-3"
    - name: "Autism screen"
      tool: "M-CHAT-R/F"
      required: true
      
  24_months:
    - name: "Developmental surveillance"
    - name: "Autism screen"
      tool: "M-CHAT-R/F"
      required: true
    - name: "Lead screen"
      notes: "If risk factors present"
      
  30_months:
    - name: "Developmental screen"
      tool: "ASQ-3"
      
  3_years:
    - name: "Vision screen"
    - name: "Blood pressure"
      notes: "Annual starting at 3 years"
      
  4_years:
    - name: "Vision screen"
    - name: "Blood pressure"
    - name: "Dyslipidemia screen"
      notes: "Once between 9-11 years"
      
  adolescent:
    - name: "Depression screen"
      tool: "PHQ-A"
      start_age_years: 12
      frequency: "annual"
    - name: "Substance use screen"
      start_age_years: 11
      frequency: "annual"
    - name: "STI screening"
      notes: "If sexually active"
    - name: "Dyslipidemia screen"
      notes: "Once between 17-21 years"
